name: Deploy plans.osdavc.com

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: plans-osdavc-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build happens on GitHub Actions, NOT on cPanel.
      - name: Build Next.js standalone application
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_API_TIMEOUT: "15000"
        run: |
          set -e

          npm run build

          if [ ! -f ".next/standalone/server.js" ]; then
            echo "ERROR: .next/standalone/server.js was not generated."
            echo "Make sure next.config.ts contains output: 'standalone'."
            exit 1
          fi

          # Next.js standalone does not automatically copy static/public files.
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static

          if [ -d "public" ]; then
            cp -R public .next/standalone/public
          fi

      - name: Prepare production release
        run: |
          set -e

          rm -rf release
          mkdir -p release

          # Copy the complete standalone runtime.
          cp -R .next/standalone/. release/

          # Database migrations required by production.
          if [ -d "database" ]; then
            cp -R database release/database
          fi

          # Database migration scripts.
          if [ -d "scripts" ]; then
            cp -R scripts release/scripts
          fi

          # Package metadata.
          cp package.json release/

          if [ -f "package-lock.json" ]; then
            cp package-lock.json release/
          fi

          # Optional deployment documentation.
          if [ -f ".github/DEPLOY_SSH.md" ]; then
            cp .github/DEPLOY_SSH.md release/DEPLOY_SSH.md
          elif [ -f "DEPLOY_SSH.md" ]; then
            cp DEPLOY_SSH.md release/DEPLOY_SSH.md
          fi

          # Passenger restart directory.
          mkdir -p release/tmp

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          PORT_VALUE="${SSH_PORT:-22}"

          ssh-keyscan \
            -p "$PORT_VALUE" \
            -H "$SSH_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e

          PORT_VALUE="${SSH_PORT:-22}"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$PORT_VALUE" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH connection successful'"

      - name: Verify production environment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e

          PORT_VALUE="${SSH_PORT:-22}"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$PORT_VALUE" \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH' && \
             if [ ! -f '$DEPLOY_PATH/.env' ]; then \
               echo 'ERROR: Production .env does not exist at $DEPLOY_PATH/.env'; \
               exit 1; \
             fi"

      - name: Deploy release over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e

          PORT_VALUE="${SSH_PORT:-22}"

          rsync \
            -az \
            --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.htaccess' \
            --exclude='storage/' \
            --exclude='.well-known/' \
            --exclude='tmp/' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT_VALUE" \
            release/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Run database migrations and restart application
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e

          PORT_VALUE="${SSH_PORT:-22}"

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$PORT_VALUE" \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -e

          NODE_BIN="/home/osdavcax/nodevenv/plans.osdavc.com/22/bin/node"

          cd "$DEPLOY_PATH"

          echo "Deployment directory:"
          pwd

          if [ ! -f ".env" ]; then
            echo "ERROR: Production .env is missing."
            exit 1
          fi

          if [ ! -f "server.js" ]; then
            echo "ERROR: Next.js standalone server.js is missing."
            exit 1
          fi

          if [ ! -x "$NODE_BIN" ]; then
            echo "ERROR: cPanel Node.js binary was not found:"
            echo "$NODE_BIN"
            exit 1
          fi

          # Remove Windows CRLF characters if the production .env
          # was previously edited/uploaded from Windows.
          sed -i 's/\r$//' .env

          echo "Node.js version:"
          "$NODE_BIN" --version

          echo "Checking production environment..."

          MYSQL_HOST_VALUE="$(
            "$NODE_BIN" \
              --env-file=.env \
              -e "process.stdout.write(process.env.MYSQL_HOST || '')"
          )"

          if [ -z "$MYSQL_HOST_VALUE" ]; then
            echo "ERROR: MYSQL_HOST is missing from production .env."
            exit 1
          fi

          echo "Production environment loaded."

          echo "Running safe database migrations..."

          if [ -f "scripts/db/migrate.js" ]; then
            "$NODE_BIN" \
              --env-file=.env \
              scripts/db/migrate.js
          else
            echo "ERROR: scripts/db/migrate.js was not deployed."
            exit 1
          fi

          echo "Restarting cPanel/Passenger application..."

          mkdir -p tmp
          touch tmp/restart.txt

          echo "Deployment completed successfully."
          REMOTE

      - name: Deployment summary
        if: success()
        run: |
          echo "========================================"
          echo "Deployment completed successfully"
          echo "Domain: https://plans.osdavc.com"
          echo "========================================"